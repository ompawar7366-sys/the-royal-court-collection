<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Aurora Luxe | Join The Royal Court</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
          tailwind.config = {
            darkMode: "class",
            theme: {
              extend: {
                colors: {
                  "primary": "#00321f",
                  "primary-container": "#004b30",
                  "on-primary": "#ffffff",
                  "tertiary": "#3a2800",
                  "tertiary-fixed-dim": "#e9c176",
                  "background": "#faf9f8",
                  "surface": "#faf9f8",
                  "outline": "#707972",
                  "error": "#ba1a1a",
                  "on-error": "#ffffff"
                },
                fontFamily: {
                  "headline": ["Noto Serif"],
                  "body": ["Manrope"]
                }
              }
            }
          }
    </script>
    <style>
        .luxury-gradient {
            background: radial-gradient(circle at center, #004b30 0%, #00321f 100%);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
        }
        input:focus {
            outline: none !important;
            border-bottom-color: #e9c176 !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body class="bg-background font-body text-primary flex items-center justify-center min-h-screen relative overflow-hidden">
    <!-- Background Decoration -->
    <div class="absolute inset-0 opacity-[0.03] pointer-events-none flex items-center justify-center">
        <span class="font-headline text-[25vw] whitespace-nowrap uppercase tracking-tighter">THE ROYAL COURT</span>
    </div>

    <main class="w-full max-w-md px-8 relative z-10">
        <div class="glass-panel p-10 rounded-xl shadow-2xl border border-white/20">
            <div class="text-center mb-10">
                <h1 class="font-headline text-3xl font-bold mb-2">Create Your Account</h1>
                <p class="text-xs font-label tracking-widest uppercase text-primary/60">Digital Registry Entry</p>
            </div>

            <form id="signup-form" class="space-y-8">
                <div class="group">
                    <label class="block text-[10px] font-label uppercase tracking-widest text-primary/60 mb-2 group-focus-within:text-tertiary transition-colors">Email Address</label>
                    <input id="email" type="email" required class="w-full bg-transparent border-0 border-b border-outline py-2 text-lg font-headline transition-all" placeholder="vault@auroraluxe.com"/>
                </div>

                <div class="group">
                    <label class="block text-[10px] font-label uppercase tracking-widest text-primary/60 mb-2 group-focus-within:text-tertiary transition-colors">Secure Password</label>
                    <input id="password" type="password" required class="w-full bg-transparent border-0 border-b border-outline py-2 text-lg font-headline transition-all" placeholder="••••••••"/>
                </div>

                <div class="group">
                    <label class="block text-[10px] font-label uppercase tracking-widest text-primary/60 mb-2 group-focus-within:text-tertiary transition-colors">Access Level</label>
                    <select id="role" class="w-full bg-transparent border-0 border-b border-outline py-2 font-medium appearance-none">
                        <option value="user">Private Collector</option>
                        <option value="admin">Estate Administrator</option>
                    </select>
                </div>

                <button type="submit" class="w-full py-4 luxury-gradient text-on-primary font-bold text-xs tracking-widest uppercase hover:shadow-xl hover:shadow-primary/20 transition-all rounded-sm flex items-center justify-center gap-3">
                    <span>Initiate Membership</span>
                    <span class="material-symbols-outlined text-sm">key</span>
                </button>
            </form>

            <div class="mt-8 text-center">
                <p class="text-[10px] font-label uppercase tracking-widest text-primary/40">Already a member?</p>
                <a href="index.html" class="inline-block mt-2 text-xs font-bold border-b border-tertiary-fixed-dim hover:text-tertiary transition-colors uppercase tracking-widest">Sign In to Vault</a>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-8 right-8 z-[100] flex flex-col gap-4 pointer-events-none"></div>

    <script>
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-4 px-6 py-4 rounded-sm shadow-2xl translate-x-12 opacity-0 transition-all duration-500 pointer-events-auto ${type === 'success' ? 'bg-primary text-on-primary border-l-4 border-tertiary-fixed-dim' : 'bg-error text-on-error'}`;
            toast.innerHTML = `<span class="material-symbols-outlined text-xl">${type === 'success' ? 'check_circle' : 'error'}</span><span class="font-label text-xs tracking-widest uppercase font-bold">${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-x-12', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('translate-x-12', 'opacity-0');
                setTimeout(() => toast.remove(), 500);
            }, 5000);
        }

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            try {
                const response = await fetch('http://127.0.0.1:8000/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role })
                });

                if (response.ok) {
                    showToast('Account Created Successfully');
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    const err = await response.json();
                    showToast(err.detail || 'Signup Failed', 'error');
                }
            } catch (err) {
                showToast('Backend Connection Failed', 'error');
            }
        });
    </script>
</body>
</html>
